[project]
name = "ixnos-data-pipeline"
version = "0.1.0"
description = "Ingestion workers for ixnos-data: fetch, validate, normalise and upsert Greek public procurement data."
authors = [
    { name = "David Gavriilidis" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
ixnos-data-pipeline = "ixnos_data_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Greek text is normal here; RUF001-003 would flag every Greek capital that looks Latin.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
# Name modules by path (tests.integration.conftest), so same-named test files do not clash.
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
