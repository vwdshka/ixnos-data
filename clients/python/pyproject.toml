[project]
name = "ixnos-data-client"
version = "0.1.0"
description = "Client for the ixnos-data API: Greek public procurement (ΚΗΜΔΗΣ) and spending (Διαύγεια) records."
readme = "README.md"
license = "MIT"
authors = [
    { name = "David Gavriilidis" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]
keywords = ["greece", "procurement", "open-data", "khmdhs", "diavgeia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/vwdshka/ixnos-data"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
