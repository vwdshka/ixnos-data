name: CI web

on:
  push:
    branches: [main]
    paths: ["web/**", "backend/**", "compose.yaml", ".github/workflows/ci-web.yml"]
  pull_request:
    paths: ["web/**", "backend/**", "compose.yaml", ".github/workflows/ci-web.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The static edition (GitHub Pages) builds from the same code.
      - run: pnpm build:static

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build web

  # The whole stack from compose.yaml (the API migrates the database on start), seeded with
  # tests/e2e/seed.sql, then Playwright against the web app.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build --wait postgres api web
      - name: Wait for the API and database
        run: |
          for i in $(seq 60); do curl -fs http://localhost:8080/health/ready && exit 0; sleep 2; done
          docker compose logs api; exit 1
      - run: docker compose exec -T postgres psql -U ixnos_data -d ixnos_data -v ON_ERROR_STOP=1 < web/tests/e2e/seed.sql

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - if: failure()
        run: docker compose logs api web
