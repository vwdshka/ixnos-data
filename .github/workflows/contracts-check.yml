name: Contracts check

# Fails when a committed contract (OpenAPI, SQL schema, web API types) no longer matches
# the code it is generated from. Fix: run scripts/generate-contracts.sh and commit.

on:
  push:
    branches: [main]
    paths: ["backend/**", "web/**", "contracts/**", "scripts/generate-contracts.sh", ".github/workflows/contracts-check.yml"]
  pull_request:
    paths: ["backend/**", "web/**", "contracts/**", "scripts/generate-contracts.sh", ".github/workflows/contracts-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - run: ./scripts/generate-contracts.sh

      - name: Fail if contracts are stale
        run: |
          if ! git diff --exit-code -- contracts web/src/lib/api/schema.d.ts; then
            echo "::error::Contracts are out of date. Run scripts/generate-contracts.sh and commit the result."
            exit 1
          fi
