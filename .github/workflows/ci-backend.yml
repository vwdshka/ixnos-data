name: CI backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "contracts/text-normalisation/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["backend/**", "contracts/text-normalisation/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - run: dotnet restore IxnosData.slnx
      - run: dotnet format IxnosData.slnx --verify-no-changes --no-restore
      - run: dotnet build IxnosData.slnx --configuration Release --no-restore
      - run: dotnet test IxnosData.slnx --configuration Release --no-build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file backend/src/IxnosData.Api/Dockerfile backend
