name: CI clients

on:
  push:
    branches: [main]
    paths: ["clients/**", "contracts/openapi/**", ".github/workflows/ci-clients.yml"]
  pull_request:
    paths: ["clients/**", "contracts/openapi/**", ".github/workflows/ci-clients.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both clients test their models against contracts/openapi/v1.json, so an API change that the
# clients don't follow fails here.
jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet test IxnosData.Client.slnx
      - run: dotnet pack src/IxnosData.Client -c Release -o artifacts

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build
