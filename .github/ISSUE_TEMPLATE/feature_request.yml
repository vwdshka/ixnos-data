name: Feature request
description: Suggest something ixnos-data should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: The problem you are trying to solve, and who you are (business, journalist, developer, citizen).
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could ixnos-data help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
